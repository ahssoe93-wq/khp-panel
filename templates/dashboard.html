{% extends "base.html" %}
{% set nav='servers' %}
{% block title %}Servers — KHP Panel{% endblock %}
{% block content %}
<div class="stats">
  <div class="stat"><b class="stat-green" id="stat-servers">–</b><span>Servers online</span></div>
  <div class="stat"><b class="stat-blue" id="stat-keys">–</b><span>Total keys</span></div>
  <div class="stat"><b class="stat-red" id="stat-expiring">–</b><span>Expiring in 7 days</span></div>
</div>
<div id="down-banner"></div>
<div class="muted small" id="last-checked" style="margin-bottom:4px"></div>

<h2 class="sec sec-find" id="search">Find a key</h2>
<div class="searchbox">
  <input id="q" type="search" placeholder="Customer name — searches ALL servers…" autocomplete="off">
</div>
<div id="search-results"></div>

<h2 class="sec sec-servers">Servers</h2>
<div class="searchbox">
  <input id="server-filter" type="search" placeholder="Filter servers…" autocomplete="off">
</div>
<div id="server-list"><div class="spin">Loading servers…</div></div>

<!-- Expiring soon (v4): collapsible — tap the header to show/hide -->
<div class="sec-head" id="expiring-head" onclick="toggleExpiring()">
  <h2 class="sec sec-exp">Expiring soon</h2>
  <span class="muted small" id="exp-hint">tap to show</span>
  <span class="badge-exp" id="exp-count"></span>
  <span class="chev" id="exp-chev">▼</span>
</div>
<div id="expiring" style="display:none"><div class="spin">Loading…</div></div>
{% endblock %}
{% block scripts %}
<script>
initDashboardSmart();
</script>
{% endblock %}
