{% extends "base.html" %}
{% block title %}Set admin password — KHP Panel{% endblock %}
{% block content %}
<div class="center">
  <div class="card">
    <h2>Welcome to KHP Panel</h2>
    <p class="muted">First run — set the one admin password for this panel.
    Only you will use it. Keep it safe.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Admin password</label>
      <input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
      <label>Repeat password</label>
      <input type="password" name="password2" required minlength="6" autocomplete="new-password">
      <div style="height:16px"></div>
      <button class="btn block" type="submit">Set password &amp; enter</button>
    </form>
  </div>
</div>
{% endblock %}
